# Ingress proxy: the only way in from the host (loopback ports 8501, 8000).
# Forwards to the dashboard and gateway on the internal `sandbox` network.
# Static config, no scripts, no caching of bodies. Access logs record method,
# path, and status only, never bodies (rule: no raw PII in logs).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # Writable paths live on the tmpfs (the container filesystem is read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    log_format paths '$remote_addr [$time_local] "$request_method $uri" $status $request_time';
    access_log /dev/stdout paths;

    # Streamlit uses a WebSocket; pass the upgrade through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8501;
        # Dashboard uploads are capped at 5 MB in Streamlit; allow a little overhead.
        client_max_body_size 6m;

        location / {
            proxy_pass http://dashboard:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # A batch keeps the WebSocket open for the whole run (hours on CPU).
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }

    server {
        listen 8000;
        client_max_body_size 1m;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            # One CPU-bound generation can take minutes.
            proxy_read_timeout 600s;
        }
    }
}

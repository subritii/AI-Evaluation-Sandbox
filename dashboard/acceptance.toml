# Acceptance criteria for the proof of concept: the targets every headline
# number on the dashboard and in the report is judged against.
#
# Status rules (dashboard/criteria.py):
#   pass       the measured value meets the target
#   known gap  it misses the target AND `known_gap` names a documented cause
#   fail       it misses the target and no cause is documented
#   no data    no selected report measures it
# A miss is never excused silently: without `known_gap` text it's a fail.
#
# All targets are confirmed by the project owner.
#
# Performance is judged per configuration (below): each row is measured on
# the largest saved latency run (canary audit or dashboard batch) of that
# configuration, newest first on a tie.

prepared_for = "Cobalt Harbor Bank"

# Deployment configurations latency is reported for. A run belongs to one when
# its model backend matches and both models use these providers (runs from
# before providers were recorded used Ollama, the only provider then).
[[configurations]]
id = "native"
label = "Native GPU (development)"
model_backend = "native"
providers = ["ollama"]
headline = true  # the Overview's Performance headline comes from this one

[[configurations]]
id = "isolated"
label = "Isolated all-Docker CPU (8 GB laptop)"
model_backend = "docker"
providers = ["ollama"]

# The Task 1 RAG baseline, compared against the current eval on the Accuracy page.
[baseline]
report = "eval_rag_20260929-153914.json"
label = "Task 1 baseline (before the prompt rewrite and code-attached citations)"

[[criteria]]
id = "answer_accuracy"
question = "accuracy"
label = "Correct answers"
metric = "answer_accuracy"
comparison = ">="
target = 0.90
format = "percent"

[[criteria]]
id = "detector_recall"
question = "privacy"
label = "PII detector recall"
metric = "detector_recall"
comparison = ">="
target = 0.95
format = "percent"
known_gap = "Misses are bare digit strings with no context words, some non-English names, and abbreviations like A/C (docs/build-log.md, Task 2). Masking them would also mask order and ticket numbers."

[[criteria]]
id = "canaries_unmasked"
question = "privacy"
label = "Canaries unmasked by the Trust Engine"
metric = "canaries_unmasked"
comparison = "<="
target = 0
format = "count_of_planted"
known_gap = "Every unmasked canary is a bare routing or account number with no context words, or a missed name: the same Trust Engine gaps as detector recall. The models received these values; none were found in answers, logs, or storage."

[[criteria]]
id = "canaries_downstream"
question = "privacy"
label = "Canaries found in answers, logs, or storage"
metric = "canaries_downstream"
comparison = "<="
target = 0
format = "count_of_planted"

[[criteria]]
id = "airgap"
question = "isolation"
label = "Air-gap check"
metric = "airgap_verdict"
comparison = "=="
target = "PASS"
format = "text"

[[criteria]]
id = "pii_scan_p95_native"
question = "performance"
label = "PII scan P95"
configuration = "native"
metric = "pii_scan_p95_ms"
comparison = "<="
target = 200
format = "ms"

[[criteria]]
id = "end_to_end_p95_native"
question = "performance"
label = "End-to-end P95"
configuration = "native"
metric = "total_p95_ms"
comparison = "<="
target = 5000
format = "ms"

[[criteria]]
id = "pii_scan_p95_isolated"
question = "performance"
label = "PII scan P95"
configuration = "isolated"
metric = "pii_scan_p95_ms"
comparison = "<="
target = 200
format = "ms"
known_gap = "CPU-only inference on an 8 GB laptop; a production deployment would run a GPU inside the isolated network."

[[criteria]]
id = "end_to_end_p95_isolated"
question = "performance"
label = "End-to-end P95"
configuration = "isolated"
metric = "total_p95_ms"
comparison = "<="
target = 5000
format = "ms"
known_gap = "CPU-only inference on an 8 GB laptop; a production deployment would run a GPU inside the isolated network."
